# Public marketing site — server-side compose file.
#
# The image is built and pushed by CI; the server only pulls. The container joins
# the dashboard's existing docker network. It was meant to reach the API as
# http://backend:8000 without leaving the host, but that route did not resolve in
# practice, so at runtime the site reads CMS content from the public API host
# (see API_BASE below) — reliable through nginx, at the cost of leaving the host
# for data. Set SITE_API_BASE to the internal URL once that network path works.
#
# The port is published on localhost only; nginx terminates TLS and proxies to it.

services:
  site:
    image: ${SITE_IMAGE:-ghcr.io/dilshodmuxtorov/yv-site:latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Where the site reads CMS content from at runtime. The internal
      # http://backend:8000 route proved unreachable on the host (the appnet
      # link/service name did not resolve), so ISR revalidation silently kept
      # serving the build-time snapshot and dashboard content edits never
      # appeared until the next deploy. Default to the public API host, which is
      # always reachable through nginx; override with SITE_API_BASE if the
      # internal network is confirmed working. (Deliberately not keyed on the
      # existing API_BASE var, which the host .env may still pin to backend:8000.)
      API_BASE: ${SITE_API_BASE:-https://dash-api.yoshlarventures.uz}
      # Canonical origin: metadata, sitemap and robots are built from this.
      SITE_URL: ${SITE_URL:-https://new.yoshlarventures.uz}
      # Staging must stay out of search results — set to "true" only on the
      # production host, once the real domain is switched over.
      SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
      # Seconds between ISR revalidations of CMS-backed pages.
      CONTENT_REVALIDATE: ${CONTENT_REVALIDATE:-300}
    ports:
      - "127.0.0.1:${SITE_PORT:-3002}:3000"
    healthcheck:
      # Uses node's global fetch rather than curl/wget, neither of which is in the
      # slim base image. Probes /api/health rather than a page so an unreachable
      # CMS never marks a perfectly healthy container as down.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - appnet

networks:
  appnet:
    # Created by the dashboard stack; this file attaches to it rather than
    # defining its own. Confirm the name with:  docker network ls | grep appnet
    external: true
    name: ${APPNET_NAME:-yv-dashboard-prod_appnet}
